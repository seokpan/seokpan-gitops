<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="725" viewBox="0 0 1000 725" role="img" aria-labelledby="title desc"><title id="title">검증부터 승인·배포까지</title><desc id="desc">번호 순서 / 소스 → 이미지 → 배포 설정 → 실행</desc><rect width="1000" height="725" rx="20" fill="#f6f8fc"/>
<text x="32" y="44" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#12253f">검증부터 승인·배포까지</text>
<text x="32" y="74" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#42526b">번호 순서 / 소스 → 이미지 → 배포 설정 → 실행</text>
<text x="32" y="110" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#52647d">JENKINS 자동화</text>
