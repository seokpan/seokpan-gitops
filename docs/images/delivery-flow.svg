<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">이미지 검증에서 배포까지</title><desc id="desc">App main 변경을 Jenkins가 검증하여 Harbor에 이미지 Digest를 기록한 다음 GitOps PR을 생성한다. 팀 승인과 병합 이후 Argo CD가 Kubernetes를 동기화한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60738e"/></marker></defs><rect width="1000" height="610" rx="16" fill="#f8fafc"/><text x="32" y="45" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#14253f">이미지 검증에서 배포까지</text><text x="32" y="75" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#435570">자동 생성과 사람의 승인 경계</text><path d="M 300 184 H 343" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 657 184 H 700" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 834 238 V 255 H 500 V 274" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 500 350 V 394" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 500 470 V 497 H 372 V 522" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 490 556 H 510" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="32" y="112" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#52647d">자동화</text><rect x="32" y="133" width="268" height="105" rx="10" fill="#ffffff" stroke="#cad5e3"/><rect x="32" y="148" width="4" height="21" rx="2" fill="#2563eb"/><text x="50" y="165" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#2563eb">01 App main</text><text x="50" y="193" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">소스 확정</text><text x="50" y="217" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">컴포넌트 Source SHA</text><rect x="343" y="133" width="314" height="105" rx="10" fill="#ffffff" stroke="#cad5e3"/><rect x="343" y="148" width="4" height="21" rx="2" fill="#2563eb"/><text x="361" y="165" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#2563eb">02 Jenkins</text><text x="361" y="193" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">테스트 · 빌드 · 스캔</text><text x="361" y="217" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">이미지 검증</text><rect x="700" y="133" width="268" height="105" rx="10" fill="#ffffff" stroke="#cad5e3"/><rect x="700" y="148" width="4" height="21" rx="2" fill="#2563eb"/><text x="718" y="165" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#2563eb">03 Harbor</text><text x="718" y="193" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">검증된 이미지</text><text x="718" y="217" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">Digest 확정</text><rect x="254" y="274" width="492" height="76" rx="10" fill="#ffffff" stroke="#cad5e3"/><rect x="254" y="289" width="4" height="21" rx="2" fill="#2563eb"/><text x="272" y="306" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700