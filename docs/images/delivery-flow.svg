<text x="52" y="164" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2563eb">01  App main · 코드 확정</text>
<text x="52" y="194" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#42526b">테스트 · 빌드 · 스캔 · 상태 확인</text>
<text x="52" y="219" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#42526b">컴포넌트별 Source SHA 기록</text>
<rect x="512" y="128" width="456" height="128" rx="12" fill="#fff" stroke="#ccd7e6"/><rect x="512" y="142" width="4" height="26" rx="2" fill="#2563eb"/>
<text x="532" y="164" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2563eb">02  Harbor · 검증된 이미지</text>
<text x="532" y="194" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#42526b">최종 이미지 Digest 확정</text>
<text x="532" y="219" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#42526b">빌드·소스 검증 기록</text>
<rect x="32" y="280" width="936" height="106" rx="12" fill="#fff" stroke="#ccd7e6"/><rect x="32" y="294" width="4" height="26" rx="2" fill="#2563eb"/>
<text x="52" y="316" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2563eb">03  GitOps 배포 PR 생성</text>
<text x="52" y="346" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#42526b">변경된 컴포넌트의 브랜치·커밋·PR 생성</text>
<text x="32" y="422" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#52647d">팀원 리뷰·승인 필수</text>
<rect x="32" y="440" width="936" height="106" rx="12" fill="#fff" stroke="#ccd7e6"/><rect x="32" y="454" width="4" height="26" rx="2" fill="#9a4b0a"/>
<text x="52" y="476" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#9a4b0a">04  변경 확인 후 Merge</text>
<text x="52" y="506" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#42526b">이미지 변경·증적 확인 후 GitOps main에 반영</text>
