<rect x="512" y="600" width="456" height="98" rx="12" fill="#fff" stroke="#ccd7e6"/><rect x="512" y="614" width="4" height="26" rx="2" fill="#0f766e"/>
<text x="532" y="636" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0f766e">06  Kubernetes 워크로드</text>
