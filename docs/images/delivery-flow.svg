<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="499" viewBox="0 0 1000 499" role="img" aria-labelledby="title desc"><title id="title">이미지 검증부터 배포까지</title><desc id="desc">1단계 Jenkins가 App main 소스를 검증, 빌드, 스캔하고 Harbor 이미지 Digest로 GitOps PR을 생성한다. 2단계 팀이 리뷰, 승인, 병합한다. 3단계 Argo CD가 Kubernetes와 동기화한다.</desc><rect width="1000" height="499" rx="16" fill="#f8fafc"/><text x="32" y="44" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#17253b">이미지 검증부터 배포까지</text><text x="32" y="74" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#4b5e78">순서대로 진행되는 자동화 · 팀 승인 · 클러스터 동기화</text><rect x="32" y="102" width="936" height="193" rx="10" fill="#edf2ff" stroke="#b8c7e3"/><text x="51" y="136" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#1657a2">01  자동화</text><rect x="51" y="151" width="286" height="71" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="69" y="178" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">App main</text><text x="69" y="204" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">소스 변경</text><rect x="357" y="151" width="286" height="71" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="375" y="178" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">Jenkins</text><text x="375" y="204" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">테스트 · 빌드 · 스캔</text><rect x="663" y="151" width="286" height="71" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="681" y="178" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">Harbor</text><text x="681" y="204" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">이미지 Digest 확정</text><text x="51" y="264" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#163b76">Jenkins가 Digest 변경 브랜치와 GitOps Promotion PR 생성</text><rect x="32" y="311" width="936" height="73" rx="10" fill="#fff6ea" stroke="#e5cba9"/><text x="51" y="340" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#946018">02  팀 승인</text><text x="258" y="343" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#263a54">GitOps PR 리뷰 · 승인 · Merge</text><rect x="32" y="400" width="936" height="73" rx="10" fill="#ecf8f4" stroke="#a9d5c6"/><text x="51" y="429" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#086b62">03  배포 반영</text><text x="258" y="432" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#263a54">Argo CD가 GitOps main을 Kubernetes에 Sync</text></svg>