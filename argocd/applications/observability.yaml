# Owner: 최유준
# Scope: Delivery & Observability
# Project: 石나가는 판단
# Purpose: kube-prometheus-stack(Prometheus/Grafana/Alertmanager) + 부속 Manifest GitOps Desired State
# Current State: Root Application 편입 완료. 이후 변경은 Git Desired State와 Argo CD Sync를 기준으로 운영합니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "88.5.4"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/observability/values-kube-prometheus-stack.yaml
    - repoURL: https://github.com/seokpan/seokpan-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/seokpan/seokpan-gitops.git
      targetRevision: main
      path: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
