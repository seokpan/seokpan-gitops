# Owner: 정태훈
# Scope: Kubernetes / Service Platform
# Project: 石나가는 판단
# Purpose: game.seokpan.soldesk.store HTTP redirect and application routing

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seokpan-http-redirect
  namespace: application
spec:
  parentRefs:
    - name: seokpan-gateway
      sectionName: http
  hostnames:
    - game.seokpan.soldesk.store
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seokpan-application
  namespace: application
spec:
  parentRefs:
    - name: seokpan-gateway
      sectionName: https
  hostnames:
    - game.seokpan.soldesk.store
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /ws/v1
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /login
        - path:
            type: Exact
            value: /lobby
        - path:
            type: Exact
            value: /rankings
        - path:
            type: PathPrefix
            value: /assets
      backendRefs:
        - name: frontend
          port: 8080
