# Owner: 최유준
# Scope: Kubernetes / Delivery & Observability
# Project: 石나가는 판단
# Purpose: Argo CD GitHub Webhook 수신용 HTTPRoute (application ns → argocd ns 라우팅)
# 관련: seokpan-gitops#117
# Created: 2026-09-18

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-webhook-route
  namespace: application
spec:
  parentRefs:
    - name: seokpan-gateway
      sectionName: https
  hostnames:
    - game.seokpan.soldesk.store
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/webhook
          method: POST
      backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
