# Owner: 정태훈
# Scope: Kubernetes / Service Platform
# Project: 石나가는 판단
# Purpose: NGINX Gateway Fabric NodePort 및 외부 트래픽 정책 정의
# Created: 2026-08-28
# Updated: 2026-08-28

apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: seokpan-gateway-proxy
  namespace: application
spec:
  kubernetes:
    service:
      type: NodePort
      externalTrafficPolicy: Cluster
      nodePorts:
        - port: 30080
          listenerPort: 80
        - port: 30443
          listenerPort: 443
