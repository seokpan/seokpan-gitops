# 작성 날짜: 2026-08-28
#
# [TODO - 확인 필요] 09 문서: "정태훈 → 최유준: FastAPI/Redis /metrics 노출" 항목이 아직
# 실제 Named Port·Label 규칙으로 확정되지 않았습니다. 아래 selector(app.kubernetes.io/name)와
# port 이름(metrics)은 가정이며, 정태훈 님과 실제 Service 라벨/포트명을 맞춰야 합니다
# (09 문서 "연동 검증": "FastAPI/Redis /metrics가 ServiceMonitor 라벨과 실제로 매칭되는지
# Prometheus Target 상태로 확인").
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seokpan-app-metrics
  namespace: observability
  labels:
    release: kube-prometheus-stack   # kube-prometheus-stack이 인식하는 selector 라벨, 배포 시 재확인
spec:
  namespaceSelector:
    matchNames:
      - application
  selector:
    matchLabels:
      app.kubernetes.io/part-of: seokpan   # [TODO] 정태훈 님 쪽 실제 라벨과 확인
  endpoints:
    - port: metrics   # [TODO] Service의 named port와 일치해야 함
      path: /metrics
      interval: 15s

