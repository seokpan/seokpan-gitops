# 작성자: 최유준
# 작성 날짜: 2026-09-14
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
roleRef:
  kind: ClusterRole
  name: alloy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      # Control Plane(cp-01~03) Pod 로그도 수집 범위에 포함 (12.1 문서: Pod·Node Log 전체 수집)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: alloy
          image: grafana/alloy:v1.6.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            # [수정, 2026-09-14, 최유준] PR 리뷰 반영: run 서브커맨드 기본 bind가
            # 127.0.0.1:12345라 Service/ServiceMonitor(Pod IP 경유)가 접근 불가했음.
            # NetworkPolicy 12·13이 이미 Prometheus↔Alloy:12345만 허용하도록 범위를
            # 제한하고 있으므로 0.0.0.0 bind로도 접근 범위는 정책으로 통제됨.
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - name: http-metrics
              containerPort: 12345
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            # 신규: journal 로그 수집용 (volatile journal만 존재, worker-01 확인)
            - name: runlogjournal
              mountPath: /run/log/journal
              readOnly: true
            - name: machineid
              mountPath: /etc/machine-id
              readOnly: true
          securityContext:
            # /run/log/journal 하위 디렉터리가 root:systemd-journal, group만 읽기
            # 가능(drwxr-s---+)이며 GID가 노드별로 동적 할당될 수 있어 group
            # 매핑 대신 root로 읽음 (worker-01 ls -la 결과 기준)
            runAsUser: 0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        # 신규
        - name: runlogjournal
          hostPath:
            path: /run/log/journal
            type: Directory
        - name: machineid
          hostPath:
            path: /etc/machine-id
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: http-metrics
      port: 12345
      targetPort: http-metrics
