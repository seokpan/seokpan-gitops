# 작성자: 최유준
# 작성 날짜: 2026-09-17
#
# [배경] 08-28 작성된 grafana-dashboard-m01-concurrency placeholder(panels: [])를
# 실제 내용으로 채우는 작업. seokpan-docs 12번 문서(MVP 검증·측정 계획)의 M-01~M-05
# 검증축을 기준으로, 핵심 KPI(프로젝트 성공 판정용)와 Run 기반 Evidence를 분리했다.
#
# [실제 계측 근거 확인 — 2026-09-17] seokpan-app의 install_metrics()(FastAPI 미들웨어)를
# 직접 확인함. 현재 실제로 노출되는 메트릭은 아래 2개뿐이다(둘 다 method/route/status 라벨):
#   seokpan_http_requests_total          (Counter)
#   seokpan_http_request_duration_seconds (Histogram)
# 이전 버전에서 사용한 vote_*, ai_analysis_*, ws_reconnect_*, seokpan_rto_seconds 등의
# 이름은 실재하지 않아 전량 제거했다. route는 FastAPI route.path_format이 그대로 라벨
# 값이 된다.
#
# [Vote 라우트 확정 — seokpan-app/backend/src/seokpan/api/game.py 직접 확인]
#   PUT    /api/v1/games/{game_id}/turns/{turn_no}/vote   (cast_vote)
#   DELETE /api/v1/games/{game_id}/turns/{turn_no}/vote   (remove_vote)
#
# [M-01 동시성 충돌의 실시간 대리 신호 발견] problems.py 확인 결과, VoteRuleViolation의
# GAME_START_CONFLICT / REQUEST_ID_CONFLICT / STALE_GAME / STALE_TURN /
# STATE_VERSION_CONFLICT 코드가 전부 HTTP 409로 매핑된다. 즉 별도 도메인 Counter 없이도
# status="409" 필터만으로 "충돌 거부 건수"를 지금 실시간으로 볼 수 있다 — 단, 이는 M-01
# 전체(DB 중복 Result/Rating 검사, Move count 비율 등)를 대체하지 않고 "충돌 발생·거부"
# 축 하나만 커버한다는 점은 아래 Row 2 안내에 남겨둔다.
#
# [12번 문서 3.2절 반영 — 임의 목표값 금지] RTO/RPO 목표값, error rate 허용 임계값,
# p95/p99 목표 지연 등을 실험 근거 없이 확정하지 말 것을 명시하고 있어, 이 파일에는
# 색상 임계값(threshold)이나 "목표 대비" 표현을 두지 않고 실측값만 보여준다. Baseline은
# 실제 단계 부하 테스트 이후 Run Evidence로 별도 정의한다.
#
# [Run 기반 Evidence — M-01/M-03/M-04/M-05] 12번 문서상 이 항목들의 측정 방법은
# "DB 비교", "request/state_version 로그·상태 비교", "장애/변경 시각 → 정상화 시각(수기)"로
# 정의되어 있어, 연속 스크레이프되는 Prometheus 시계열이 아니라 Run 단위(Run ID +
# DB/로그 스냅샷 비교) Evidence로 수집되는 것이 문서상 설계다. 백엔드가 별도 도메인 Counter
# (예: seokpan_vote_conflict_total)를 추가하기로 결정하기 전까지는 이 대시보드에 실시간
# 패널로 넣지 않고, 무엇을 봐야 하는지와 측정 방법만 텍스트 패널로 남겨둔다.
#
# [ANALYSIS Runtime] 12번 문서 3.3절: "현재 1차 MVP에는 별도 ANALYSIS Runtime을
# 배포하지 않는다." AI 판세 분석 관련 패널은 2차 확장 예정 섹션으로 분리하고 현재는
# 빈 자리로만 둔다.
#
# [구조] Row 1(M-02 핵심 KPI + M-01 충돌, 상시 펼침): 지금 실제로 값이 들어오는 유일한 축.
# Row 2(Run 기반 Evidence — M-03/M-04/M-05 + M-01 DB검증, 상시 펼침): 측정 방법 안내, 실시간
# 패널 아님(문서상 원래 연속 메트릭으로 설계되지 않은 항목이므로 여기에 그대로 둔다).
# Row 3(실시간 계측 계약 — 팀 확인 전, 상시 펼침): WS 연결수/Active Room·Game/재연결 성공률/
# 연결 분포/Playbook 결과. 성격상 원래 연속 메트릭이 맞는 항목이라 이름을 실제 코드
# 클래스(ActiveWebSocketRegistry, RoomConnectionCoordinator)에 맞춰 제안해뒀으나, 패널
# 제목에 "(제안, 미확정)"을 명시해 확정된 계약으로 오인되지 않게 한다. 백엔드가 이 이름대로
# 구현하면 패널 수정 없이 값만 채워진다.
# Row 4(진단 지표, 기본 접힘): Backend 전체 HTTP 개요. Node/Cluster 레벨 CPU/Memory/Disk/
# Network는 grafana-dashboard-infra-overview / grafana-dashboard-vm-overview에 이미 있으므로
# 중복 없이 링크만 건다.
# Row 5(2차 확장 예정, 기본 접힘): ANALYSIS Runtime 배포 이후 채울 자리 — Runtime 자체가
# 미배포라 지금은 이름 제안조차 하지 않는다(근거 부족).
#
# [Datasource] Prometheus가 isDefault: true이므로 datasource 명시 생략(기존 컨벤션 동일).

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-m01-concurrency
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  m01-concurrency.json: |
    {
      "title": "Service / KPI Overview",
      "uid": "seokpan-service-kpi-overview",
      "tags": ["seokpan", "service", "kpi", "m01", "m02"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 100,
          "title": "M-02 Vote 처리 성능 + M-01 충돌 거부 (실측, 실제 계측됨)",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "title": "Vote 처리량 (req/s, method별)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 1 },
          "targets": [
            { "expr": "sum by (method) (rate(seokpan_http_requests_total{route=\"/api/v1/games/{game_id}/turns/{turn_no}/vote\"}[5m]))", "legendFormat": "{{method}}" }
          ]
        },
        {
          "id": 2,
          "title": "Vote 오류율 (%, 5xx 기준)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 6, "x": 6, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            { "expr": "100 * sum(rate(seokpan_http_requests_total{route=\"/api/v1/games/{game_id}/turns/{turn_no}/vote\", status=~\"5..\"}[5m])) / sum(rate(seokpan_http_requests_total{route=\"/api/v1/games/{game_id}/turns/{turn_no}/vote\"}[5m]))", "legendFormat": "error rate" }
          ]
        },
        {
          "id": 3,
          "title": "Vote p95 / p99 지연",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(seokpan_http_request_duration_seconds_bucket{route=\"/api/v1/games/{game_id}/turns/{turn_no}/vote\"}[5m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(seokpan_http_request_duration_seconds_bucket{route=\"/api/v1/games/{game_id}/turns/{turn_no}/vote\"}[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 4,
          "title": "M-01 충돌/Stale 거부 건수 (409)",
          "type": "timeseries",
          "description": "GAME_START_CONFLICT / REQUEST_ID_CONFLICT / STALE_GAME / STALE_TURN / STATE_VERSION_CONFLICT → 전부 HTTP 409로 매핑됨(problems.py 확인). M-01의 '충돌 발생·거부' 축만 커버 — DB 중복 Result/Rating 검사는 별도 Run Evidence 필요(아래 Row 2).",
          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 1 },
          "targets": [
            { "expr": "sum by (method) (increase(seokpan_http_requests_total{route=\"/api/v1/games/{game_id}/turns/{turn_no}/vote\", status=\"409\"}[$__interval]))", "legendFormat": "{{method}} - 409 conflict" }
          ]
        },
        {
          "id": 200,
          "title": "Run 기반 Evidence — M-01 DB 검증 / M-03 복구 / M-04 DR / M-05 Ansible (실시간 메트릭 아님)",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "panels": []
        },
        {
          "id": 20,
          "title": "측정 방법 안내 (12번 문서 정량 측정 Catalog 기준)",
          "type": "text",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 9 },
          "options": {
            "mode": "markdown",
            "content": "409 충돌 거부 건수는 위 Row 1에서 실시간으로 보입니다. 아래는 그걸로 커버되지 않는, 여전히 Run 단위 Evidence(Run ID + DB/로그 스냅샷 비교)로만 확인 가능한 항목입니다.\n\n| 검증축 | 항목 | 측정 방법/출처 | 목표 |\n|---|---|---|---|\n| M-01 | Move count / 중복 Result·Rating / stale state mutation | DB 비교, request/state_version 로그 비교 | 중복·stale 0건 |\n| M-03 | Recovery time | 장애/변경 시각 → 정상화 시각(수기) | - |\n| M-03 | Reconnect success | 성공 재연결 / 재연결 시도 | - |\n| M-03 | Wrong loss decision | 장애 원인 오패배 판정 | 0건 |\n| M-04 | RTO / RPO | Data/Storage Recovery 담당 Evidence | - |\n| M-05 | 구축/재구축 시간, 개입·실패 Task | 수동 대비 Ansible 실행 Evidence | - |\n\n색상 임계값이나 목표 수치를 이 대시보드에 고정하지 않습니다 — seokpan-docs 12번 문서 3.2절(임의 목표값 금지)에 따라 Baseline은 실제 부하 테스트 Run으로만 정의합니다."
          }
        },
        {
          "id": 250,
          "title": "실시간 계측 계약 — 팀 확인 전 (WS 연결/재연결/Playbook)",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 },
          "panels": []
        },
        {
          "id": 21,
          "title": "WS 활성 연결 수 (제안, 미확정)",
          "type": "timeseries",
          "description": "제안 메트릭 — ActiveWebSocketRegistry 기준. 실제 이름/라벨은 백엔드(정태훈) 확인 필요. seokpan_ws_active_connections{room_id} (Gauge)",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 20 },
          "fieldConfig": { "defaults": { "noValue": "계측 대기중" } },
          "targets": [
            { "expr": "sum(seokpan_ws_active_connections)", "legendFormat": "active connections" }
          ]
        },
        {
          "id": 22,
          "title": "Active Room / Game (제안, 미확정)",
          "type": "timeseries",
          "description": "제안 메트릭 — seokpan_room_active_total / seokpan_game_active_total (Gauge)",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 20 },
          "fieldConfig": { "defaults": { "noValue": "계측 대기중" } },
          "targets": [
            { "expr": "seokpan_room_active_total", "legendFormat": "active rooms" },
            { "expr": "seokpan_game_active_total", "legendFormat": "active games" }
          ]
        },
        {
          "id": 23,
          "title": "재연결 성공률 (%, 제안, 미확정)",
          "type": "timeseries",
          "description": "제안 메트릭 — RoomConnectionCoordinator.connect()/disconnect()의 connection_generation 기준. seokpan_ws_reconnect_total{result=\"success|failed\"} (Counter)",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 20 },
          "fieldConfig": { "defaults": { "noValue": "계측 대기중", "unit": "percent" } },
          "targets": [
            { "expr": "100 * sum(rate(seokpan_ws_reconnect_total{result=\"success\"}[5m])) / sum(rate(seokpan_ws_reconnect_total[5m]))", "legendFormat": "reconnect success rate" }
          ]
        },
        {
          "id": 24,
          "title": "Backend 연결 분포 (room_id별, 제안, 미확정)",
          "type": "timeseries",
          "description": "제안 메트릭 — seokpan_ws_active_connections{room_id} 라벨 합. HTTP 요청 분포는 Row 3 진단 지표에 이미 실측으로 있음(별개 지표).",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 27 },
          "fieldConfig": { "defaults": { "noValue": "계측 대기중" } },
          "targets": [
            { "expr": "sum by (room_id) (seokpan_ws_active_connections)", "legendFormat": "{{room_id}}" }
          ]
        },
        {
          "id": 25,
          "title": "Playbook 실행 결과 (OK / Changed / Failed, 제안, 미확정)",
          "type": "timeseries",
          "description": "제안 메트릭 — Ansible 콜백 플러그인 또는 Jenkins 실행 후처리에서 Pushgateway로 push. ansible_playbook_task_result_total{playbook, status} (Counter)",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 27 },
          "fieldConfig": { "defaults": { "noValue": "계측 대기중" } },
          "targets": [
            { "expr": "sum by (status) (increase(ansible_playbook_task_result_total[$__interval]))", "legendFormat": "{{status}}" }
          ]
        },
        {
          "id": 300,
          "title": "진단 지표 (Backend HTTP 전체 개요)",
          "type": "row",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 34 },
          "panels": [
            {
              "id": 5,
              "title": "인프라 리소스 — Infra/VM Overview 참고",
              "type": "text",
              "gridPos": { "h": 3, "w": 24, "x": 0, "y": 35 },
              "options": {
                "mode": "markdown",
                "content": "클러스터 노드는 [Kubernetes / Infrastructure Overview](/d/seokpan-infra-overview), 외부 VM은 [External VM Overview](/d/seokpan-vm-overview) 참고. 중복 방지를 위해 이 대시보드에는 재게시하지 않음."
              }
            },
            {
              "id": 6,
              "title": "Backend 전체 요청 분포 (route별)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 38 },
              "targets": [
                { "expr": "sum by (route) (rate(seokpan_http_requests_total[5m]))", "legendFormat": "{{route}}" }
              ]
            },
            {
              "id": 7,
              "title": "Backend 전체 오류율 (%, route별 5xx)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 38 },
              "fieldConfig": { "defaults": { "unit": "percent" } },
              "targets": [
                { "expr": "100 * sum by (route) (rate(seokpan_http_requests_total{status=~\"5..\"}[5m])) / sum by (route) (rate(seokpan_http_requests_total[5m]))", "legendFormat": "{{route}}" }
              ]
            },
            {
              "id": 8,
              "title": "Backend 전체 요청 지연 (route별 p95)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 46 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                { "expr": "histogram_quantile(0.95, sum(rate(seokpan_http_request_duration_seconds_bucket[5m])) by (le, route))", "legendFormat": "{{route}} p95" }
              ]
            }
          ]
        },
        {
          "id": 400,
          "title": "2차 확장 예정 — ANALYSIS Runtime 배포 후 (현재 미배포)",
          "type": "row",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 35 },
          "panels": [
            {
              "id": 9,
              "title": "ANALYSIS Runtime 미배포 안내",
              "type": "text",
              "gridPos": { "h": 4, "w": 24, "x": 0, "y": 36 },
              "options": {
                "mode": "markdown",
                "content": "12번 문서 3.3절: \"현재 1차 MVP에는 별도 ANALYSIS Runtime을 배포하지 않는다.\" AI 판세 분석 처리시간/실패율/stale 반영 건수 패널은 ANALYSIS Runtime이 실제 배포되고 메트릭 이름이 확정된 뒤 이 Row에 추가한다."
              }
            }
          ]
        }
      ]
    }
