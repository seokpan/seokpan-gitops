# 작성자: 최유준
# 작성 날짜: 2026-08-28 (2026-08-31 정합화 개정: namespace / kubelet CIDR / LB-01 ipBlock)
#
# [배경] Calico NetworkPolicy가 단계적으로 Default Deny로 전환되는 설계라,
# observability Sync 시점 전에 아래 허용 규칙이 먼저 있어야 배포 직후 통신이 막히지 않습니다.
# (선행 조건 #2, README.md 참고)
#
# [확정 (2026-08-28, 정태훈 님 요청에 따라 정리)] 아래 통신 목록을 기준으로 작성:
#   Prometheus → kube-state-metrics / kubelet(+cAdvisor) / node_exporter / mysqld_exporter / haproxy_exporter / FastAPI·Redis / Alertmanager
#   Grafana → Prometheus / Loki
#   Alloy(DaemonSet, in-cluster) → Loki
#   Alertmanager → SMTP(외부, 587/465)
#
# [TODO] 실제 Default Deny 정책(GlobalNetworkPolicy 등)이 이유빈 님 쪽에서 어떤 이름/범위로
# 적용되는지 확인 후, 아래 podSelector/namespaceSelector 라벨이 실제 배포되는 리소스와
# 일치하는지 재검증 필요 (kube-prometheus-stack Helm Chart의 기본 라벨과 다를 수 있음).
#
# [해결됨, 2026-08-31] kubelet 대상 CIDR: 192.168.54.0/24(NFS/Ansible 서브넷, 오기)
# → 실제 CP/Worker Node 5개 IP(/32)로 교체(05 물리 아키텍처 IP 배정표 기준)
#
# [해결됨, 2026-08-31] LB-01(10.1.93.78)이 51~54.0/24 어디에도 속하지 않아
# haproxy_exporter(9101) 트래픽이 허용되지 않던 누락을 발견하여 별도 ipBlock으로 추가
#
# [해결됨, 2026-08-31] VRouter 1~4 IP 확보(물리아키텍처_수정 다이어그램) → 개별 ipBlock 추가
# VRouter-01 192.168.51.10 / VRouter-02 192.168.52.10 / VRouter-03 192.168.53.10 / VRouter-04 192.168.54.10
#
# [TODO] loadgen IP는 여전히 미확정. 확정되면 이 규칙에 /32로 추가할 것.
#
# [확인 완료, 2026-08-31] "물리아키텍처_수정" 다이어그램에서 MariaDB-01/02 Primary/Replica
# 배정, Harbor IP, NFS/Ansible Controller IP가 기존 값과 다르게 그려져 있었으나,
# 최유준 확인 결과 기존 값이 맞고 해당 다이어그램 쪽 오탈자로 확정됨(다이어그램 수정 필요 - 별도 전달).
# MariaDB-01(Primary, Server-02) 192.168.52.40 / MariaDB-02(Replica, Server-01) 192.168.51.40
# Harbor 192.168.53.61 / NFS 192.168.54.50 / Ansible Controller 192.168.54.70


# 1) Prometheus → in-cluster 대상 (kube-state-metrics, FastAPI/Redis, Alertmanager)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-in-cluster
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}   # kube-state-metrics 네임스페이스 확정 후 좁힐 것
      ports:
        - protocol: TCP
          port: 8080    # kube-state-metrics
    - to:
        - namespaceSelector: {}   # Backend(FastAPI)/Redis 네임스페이스(application) 확정 후 좁힐 것
      ports:
        - protocol: TCP
          port: 8000    # [TODO] Backend/Redis 실제 metrics 포트로 교체 (servicemonitor-app.yaml 참고, 정태훈 확인 필요)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 2) Prometheus → kubelet/cAdvisor (Node IP 직접 스크랩, Pod 대상이 아니므로 ipBlock 사용)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-kubelet
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.51.20/32   # cp-01
        - ipBlock:
            cidr: 192.168.51.30/32   # worker-01
        - ipBlock:
            cidr: 192.168.52.20/32   # cp-02
        - ipBlock:
            cidr: 192.168.52.30/32   # worker-02
        - ipBlock:
            cidr: 192.168.53.20/32   # cp-03
      ports:
        - protocol: TCP
          port: 10250   # kubelet metrics/cAdvisor
---
# 3) Prometheus → 외부 VM Exporter (node_exporter / mysqld_exporter / haproxy_exporter)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-external-exporters
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.51.0/24   # VRouter/loadgen IP 미확정으로 서브넷 유지 (TODO)
        - ipBlock:
            cidr: 192.168.52.0/24   # VRouter/loadgen IP 미확정으로 서브넷 유지 (TODO)
        - ipBlock:
            cidr: 192.168.53.0/24   # VRouter/loadgen IP 미확정으로 서브넷 유지 (TODO)
        - ipBlock:
            cidr: 192.168.54.0/24   # VRouter/loadgen IP 미확정으로 서브넷 유지 (TODO)
        - ipBlock:
            cidr: 10.1.93.78/32     # LB-01 (기존 51~54 서브넷에 없어서 누락돼 있었음)
        - ipBlock:
            cidr: 192.168.51.10/32   # VRouter-01
        - ipBlock:
            cidr: 192.168.52.10/32   # VRouter-02
        - ipBlock:
            cidr: 192.168.53.10/32   # VRouter-03
        - ipBlock:
            cidr: 192.168.54.10/32   # VRouter-04
      ports:
        - protocol: TCP
          port: 9100    # node_exporter
        - protocol: TCP
          port: 9104    # mysqld_exporter
        - protocol: TCP
          port: 9101    # haproxy_exporter
---
# 4) Grafana → Prometheus / Loki
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-egress-datasources
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 5) Alloy(DaemonSet, in-cluster) → Loki
# [주의] 외부 VM(systemd Alloy)에서 Loki로 들어오는 경로는 이 NetworkPolicy 대상이 아님 —
# 그건 Loki Service를 향한 Ingress 규칙(NodePort, 포트는 미확정)이며 이 파일 범위 밖. 별도 확인 필요.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-egress-loki
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
---
# 6) Alertmanager → SMTP (클러스터 밖 이메일 발송)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-egress-smtp
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0   # [TODO] 실제 SMTP 서버 IP 확정 후 /32로 좁힐 것
      ports:
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
