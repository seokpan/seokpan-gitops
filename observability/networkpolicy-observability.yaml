# 작성자: 최유준
# 작성 날짜: 2026-08-28 (2026-08-31 정합화 개정: namespace / kubelet CIDR / LB-01 ipBlock)
#
# [현행 설명, 2026-09-29] 이 파일은 observability Namespace의 허용 NetworkPolicy를 관리합니다.
# 현재 seokpan-gitops Repository에는 Default Deny Manifest가 없으므로, Default Deny가 실제 Runtime에
# 어떤 이름/범위로 적용되는지는 별도 Source/Runtime Evidence로 확인해야 합니다.
#
# [확정 (2026-08-28)] 아래 통신 목록을 기준으로 작성:
#   Prometheus → kube-state-metrics / kubelet(+cAdvisor) / node_exporter / mysqld_exporter / haproxy_exporter / FastAPI·Redis / Alertmanager
#   Grafana → Prometheus / Loki
#   Alloy(DaemonSet, in-cluster) → Loki
#   Alertmanager → SMTP(외부, 현재 선언 587; 정책에는 legacy 465 허용도 남아 있음)
#
# [현행화, 2026-09-29] Namespace와 주요 Service/ServiceMonitor Source는 현재 Repository에서
# 확인 가능하지만, 아래 일부 namespaceSelector:{}·광범위 ipBlock은 실제 최소권한으로 좁혀진 상태가 아닙니다.
# 동작 중인 Target/Alert/Log 경로를 확인하기 전 정책값을 임의 축소하지 않으며, hardening은 후속 보안 요구와 Runtime Evidence를 기준으로 재평가합니다.
#
# [해결됨, 2026-08-31] kubelet 대상 CIDR: 192.168.54.0/24(NFS/Ansible 서브넷, 오기)
# → 실제 CP/Worker Node 5개 IP(/32)로 교체(05 물리 아키텍처 IP 배정표 기준)
#
# [해결됨, 2026-08-31] LB-01(10.1.93.78)이 51~54.0/24 어디에도 속하지 않아
# haproxy_exporter(9101) 트래픽이 허용되지 않던 누락을 발견하여 별도 ipBlock으로 추가
#
# [해결됨, 2026-08-31] VRouter 1~4 IP 확보(물리아키텍처_수정 다이어그램) → 개별 ipBlock 추가
# VRouter-01 192.168.51.10 / VRouter-02 192.168.52.10 / VRouter-03 192.168.53.10 / VRouter-04 192.168.54.10
#
# [현행화, 2026-09-29] 현재 node-exporter-external EndpointSlice에는 loadgen이 포함되지 않습니다.
# 아래 51~54 /24 허용을 loadgen placeholder로 설명하지 않으며, 실제 Exporter Target Inventory 기준 축소는 후속 hardening 재평가 대상으로 둡니다.
#
# [확인 완료, 2026-08-31] "물리아키텍처_수정" 다이어그램에서 MariaDB-01/02 Primary/Replica
# 배정, Harbor IP, NFS/Ansible Controller IP가 기존 값과 다르게 그려져 있었으나,
# Inventory·Runbook 교차검증 결과 기존 값이 맞고 해당 다이어그램 쪽 오탈자로 확정됨.
# MariaDB-01(Primary, Server-02) 192.168.52.40 / MariaDB-02(Replica, Server-01) 192.168.51.40
# Harbor 192.168.53.61 / NFS 192.168.54.50 / Ansible Controller 192.168.54.70
# [해결됨, 2026-09-03] Ingress 규칙 전체 누락(Prometheus←Grafana, Alertmanager←Prometheus,
# Loki←Grafana/Alloy) 발견 및 추가. 기존 파일은 Egress만 정의되어 있어 Default Deny 전환 시
# observability 스택 내부 통신이 전부 막히는 상태였음.
# [해결됨, 2026-09-03] Alloy·Alertmanager egress에 DNS(53) 규칙 누락 발견 및 추가.
# [해결됨, 2026-09-03] CoreDNS namespace 확인 완료 — kube-system, kube-dns Service(10.96.0.10:53).
# 기존 DNS egress(정책 1, 4)의 namespaceSelector: {} 를 kube-system으로 좁히고,
# 신규 추가된 Alloy(정책 5)·Alertmanager(정책 6) DNS egress도 동일하게 kube-system으로 통일.
# [해결됨, 2026-09-14, 최유준] Prometheus target 19건 down(context deadline exceeded) 원인 3종 해결.
# (1) kube-controller-manager(10257)/kube-scheduler(10259)/kube-etcd(2381)/kube-proxy(10249) 미허용
# (2) CoreDNS(9153)/Grafana(3000)/operator(10250, Pod IP) 미허용
# (3) Alertmanager Ingress에 config-reloader(8080) 미허용


# 1) Prometheus → in-cluster 대상 (kube-state-metrics, FastAPI/Redis, Alertmanager)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-in-cluster
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}   # 현재 kube-prometheus-stack은 observability에 배포. selector 축소는 동작 검증을 전제로 후속 재평가
      ports:
        - protocol: TCP
          port: 8080    # kube-state-metrics
    - to:
        - namespaceSelector: {}   # Backend /metrics는 application. Redis(6379)는 이 8000 규칙 대상이 아님; selector 축소는 동작 검증을 전제로 후속 재평가
      ports:
        - protocol: TCP
          port: 8000    # Backend Service http:8000 /metrics — servicemonitor-app.yaml 기준
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}   # 현재 kube-prometheus-stack은 observability에 배포. selector 축소는 동작 검증을 전제로 후속 재평가
      ports:
        - protocol: TCP
          port: 8080    # kube-state-metrics
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 9153    # CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 3000    # Grafana
        - protocol: TCP
          port: 10250   # kube-prometheus-stack-operator (Pod IP, kubelet 정책과 별개)
    - to:
        - namespaceSelector: {}   # Backend /metrics는 application. Redis(6379)는 이 8000 규칙 대상이 아님; selector 축소는 동작 검증을 전제로 후속 재평가
      ports:
        - protocol: TCP
          port: 8000    # Backend Service http:8000 /metrics — Redis metrics 규칙 아님
---
# 2) Prometheus → kubelet/cAdvisor (Node IP 직접 스크랩, Pod 대상이 아니므로 ipBlock 사용)
# [해결됨, 2026-09-11→2026-09-14 되돌림] PR #70에서 controller-manager(10257)/scheduler(10259)/
# etcd(2381)/kube-proxy(10249) egress를 임시 추가했으나, Issue #177 결정에 따라
# 해당 4종 직접 Scrape 자체를 kube-prometheus-stack에서 비활성화하기로 하여 불필요해진
# egress 허용을 제거함(최소 권한 원칙). 10250(kubelet)만 유지.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-kubelet
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.51.20/32   # cp-01
        - ipBlock:
            cidr: 192.168.51.30/32   # worker-01
        - ipBlock:
            cidr: 192.168.52.20/32   # cp-02
        - ipBlock:
            cidr: 192.168.52.30/32   # worker-02
        - ipBlock:
            cidr: 192.168.53.20/32   # cp-03
      ports:
        - protocol: TCP
          port: 10250   # kubelet metrics/cAdvisor

---
# 3) Prometheus → 외부 VM Exporter (node_exporter / mysqld_exporter / haproxy_exporter)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-external-exporters
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.51.0/24   # legacy broad allow — 현재 Target Inventory 기준 /32 축소 여부는 후속 hardening 재평가
        - ipBlock:
            cidr: 192.168.52.0/24   # legacy broad allow — 현재 Target Inventory 기준 /32 축소 여부는 후속 hardening 재평가
        - ipBlock:
            cidr: 192.168.53.0/24   # legacy broad allow — 현재 Target Inventory 기준 /32 축소 여부는 후속 hardening 재평가
        - ipBlock:
            cidr: 192.168.54.0/24   # legacy broad allow — 현재 Target Inventory 기준 /32 축소 여부는 후속 hardening 재평가
        - ipBlock:
            cidr: 10.1.93.78/32     # LB-01 (기존 51~54 서브넷에 없어서 누락돼 있었음)
        - ipBlock:
            cidr: 192.168.51.10/32   # VRouter-01
        - ipBlock:
            cidr: 192.168.52.10/32   # VRouter-02
        - ipBlock:
            cidr: 192.168.53.10/32   # VRouter-03
        - ipBlock:
            cidr: 192.168.54.10/32   # VRouter-04
      ports:
        - protocol: TCP
          port: 9100    # node_exporter
        - protocol: TCP
          port: 9104    # mysqld_exporter
        - protocol: TCP
          port: 8404    # haproxy_exporter
        - protocol: TCP
          port: 9090    # harbor_exporter
---
# 4) Grafana → Prometheus / Loki / kube-apiserver (sidecar ConfigMap/Secret watch)
# [해결됨, 2026-09-14, 최유준] grafana-sc-datasources/grafana-sc-dashboard sidecar가
# ConfigMap/Secret watch를 위해 kube-apiserver에 직접 질의해야 하는데 egress 누락으로
# list-based sync가 계속 타임아웃(10.96.0.1:443 connect timeout) -> provisioning 디렉토리가
# 항상 비어있어 datasource/dashboard가 전혀 반영되지 않던 문제.
# Prometheus egress(정책 10)와 동일 패턴: CP 3대 IP(05 물리 아키텍처 기준) /32, port 6443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-egress-datasources
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 192.168.51.20/32   # cp-01
        - ipBlock:
            cidr: 192.168.52.20/32   # cp-02
        - ipBlock:
            cidr: 192.168.53.20/32   # cp-03
      ports:
        - protocol: TCP
          port: 6443

---
# 5) Alloy(DaemonSet, in-cluster) → Loki
# [주의] 외부 VM(systemd Alloy)에서 Loki로 들어오는 경로는 이 NetworkPolicy 대상이 아님 —
# 그건 Loki Service를 향한 Ingress 규칙(NodePort, 포트는 미확정)이며 이 파일 범위 밖. 별도 확인 필요.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-egress-loki
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector: 
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 6) Alertmanager → SMTP (클러스터 밖 이메일 발송)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-egress-smtp
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0   # 현재 SMTP는 smtp.resend.com:587. 표준 NetworkPolicy는 FQDN selector가 없어 IP/CIDR 축소는 후속 보안 검토에서 판단
      ports:
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
    - to:
        - namespaceSelector: 
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# 7) [신규 추가, 2026-09-03] Prometheus ← Grafana Ingress
# Grafana의 Egress(정책 4, Prometheus:9090)와 짝을 이루는 Ingress 허용 규칙.
# Ingress 없이는 Default Deny 전환 시 Grafana→Prometheus 데이터 조회가 막힘.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress-grafana
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
---
# 8) [신규 추가, 2026-09-03] Alertmanager ← Prometheus Ingress
# Prometheus의 Egress(정책 1, Alertmanager:9093)와 짝을 이루는 Ingress 허용 규칙.
# Ingress 없이는 Prometheus가 평가한 Alert가 Alertmanager로 전달되지 못함(G-07 Gate 직결).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress-prometheus
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8080    # [해결됨, 2026-09-14] config-reloader sidecar - Prometheus egress는 이미 허용(정책 1, namespaceSelector:{} 8080)되어 있었으나 Alertmanager 쪽 Ingress 미허용으로 막혀 있었음
---
# 9) [신규 추가, 2026-09-03] Loki ← Grafana / Alloy Ingress
# Grafana의 Egress(정책 4, Loki:3100)와 Alloy의 Egress(정책 5, Loki:3100) 양쪽과 짝을 이루는 Ingress.
# Ingress 없이는 Grafana의 Log 조회와 Alloy의 Log 수집·전달이 모두 막힘.
# [참고] 외부 VM(systemd Alloy)의 수집 경로는 별도 NodePort Ingress이며 이 정책 범위 밖(정책 5 주석 참고).
# [해결됨, 2026-09-11, 최유준] Prometheus → kube-apiserver(6443) Egress 규칙 누락 발견 및 추가.
# kubernetes_sd_configs(role: endpoints 등)가 Service Discovery를 위해 kube-apiserver에
# 직접 질의해야 하는데 이 경로가 통째로 빠져 있어 activeTargets=0(전체 Target 미수집) 상태였음.
# CP 3대 IP(05 물리 아키텍처 기준)에 /32로 제한. Common VIP가 아니라 CP 개별 IP로 직접 통신하는
# 것이 정상 — kube-apiserver Service의 실제 Endpoints가 CP 3대 IP:6443으로 구성되어 있음
# (kubectl get endpoints kubernetes -n default 확인).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress-grafana-alloy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 3100

---
# 10) [신규 추가, 2026-09-11] Prometheus → kube-apiserver (Service Discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-apiserver
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.51.20/32   # cp-01
        - ipBlock:
            cidr: 192.168.52.20/32   # cp-02
        - ipBlock:
            cidr: 192.168.53.20/32   # cp-03
      ports:
        - protocol: TCP
          port: 6443

---
# 11) [신규 추가, 2026-09-14, 최유준] Alloy → kube-apiserver (discovery.kubernetes Pod 목록 조회)
# [현행화, 2026-09-29] 아래 정책은 이미 Manifest에 반영된 현재 Source입니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-egress-apiserver
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.51.20/32   # cp-01
        - ipBlock:
            cidr: 192.168.52.20/32   # cp-02
        - ipBlock:
            cidr: 192.168.53.20/32   # cp-03
      ports:
        - protocol: TCP
          port: 6443
---
# 12) [신규 추가, 2026-09-14, 최유준] Prometheus → Alloy:12345 (자체 메트릭 Scrape)
# 정책 1(allow-prometheus-egress-in-cluster)에 12345 룰이 없어 별도 정책으로 분리.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-alloy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 12345
---
# 13) [신규 추가, 2026-09-14, 최유준] Alloy ← Prometheus Ingress
# 정책 5(allow-alloy-egress-loki)는 Egress만 정의하고 있어 policyTypes에 Ingress가 없었음.
# Ingress 없이는 정책 12(Prometheus egress)가 있어도 편도로 막힘 — Grafana/Prometheus/Alertmanager
# 때(정책 7·8·9)와 동일하게 대칭 Ingress 규칙 필요.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-ingress-prometheus
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 12345
