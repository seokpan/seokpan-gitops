# 작성자: 최유준
# 작성 날짜: 2026-09-01
# observability/values-kube-prometheus-stack.yaml

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-storage   
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
          selector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
    retention: 7d
    # nodeAffinity로 worker-01 고정 (prometheus-local-pv.yaml의 PV와 짝을 맞춰야 함)
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["worker-01"]

grafana:
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

alertmanager:
  alertmanagerSpec:
    storage: {}   # README: 기본 PVC 없음
    # [2026-09-15] configSecret 명시 — 미지정 시 기본값이 alertmanager-<CR이름>으로
    # 잡혀 기존 alertmanager-config Secret과 이름이 어긋남. alertmanager.yaml을
    # 소유하는 Secret을 명시적으로 고정.
    configSecret: alertmanager-config
    # Ansible이 별도 공급하는 SMTP Credential(smtp-password 1개 키)을
    # /etc/alertmanager/secrets/alertmanager-smtp-credential/ 경로에 마운트.
    # configSecret(alertmanager.yaml 소유)과는 별개 — 06 문서 4.1 Secret 경계 준수.
    secrets:
      - alertmanager-smtp-credential

# [해결됨, 2026-09-14, 최유준] Issue #177 결정:
# Chart 기본값으로 controller-manager/scheduler/etcd/kube-proxy Scrape가 활성화되어 있었으나,
# G-07(06 문서 14장)이 이 4종 Component 직접 수집을 요구 대상으로 명시하지 않음을 확인.
# Technical Freeze(9/16) 임박 대비 kubeadm 재구성·host firewall 신설 비용이 과도하여 비활성화 결정.
# (참고: kube-proxy는 DaemonSet으로 CP+Worker 전체 대상이며, controller-manager/scheduler/etcd
#  Static Pod 3종과는 배포 형태가 다름 — bind-address 방식도 각각 다름)
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
