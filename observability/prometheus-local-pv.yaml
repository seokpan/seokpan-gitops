# 작성자: 최유준
# 작성 날짜: 2026-08-28
#
# [확정] 정태훈 님과 협의 완료 (2026-08-28) — Prometheus는 worker-01에 배치.
# 근거: Prometheus/Loki를 서로 다른 Worker에 분리해서 F-13(Node 유실) 장애 실험 시
# Metric·Log 유실 범위를 독립적으로 측정하기 위함 (Loki는 worker-02).
#
# [Node 측 준비] hostPath 디렉토리(/mnt/observability/prometheus)는 worker-01에
# 사전에 생성 + 권한 설정되어 있어야 합니다 (Ansible Role 또는 수동 준비, 별도 확인 필요).
#
# [용량/보존] 06 문서 기준 "7일 또는 20GiB, Node 종속·일부 Metric 유실 수용" —
# PV 용량은 이 20GiB 기준에 맞춤. 실제 시계열 보존 정책(retention)은
# kube-prometheus-stack values의 prometheus.prometheusSpec.retention/retentionSize로 별도 설정 필요
# (이 파일은 Storage 용량만 다룸).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-local-pv
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/observability/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker-01

