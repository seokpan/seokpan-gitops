# 작성자: 최유준
# 작성 날짜: 2026-08-28
#
# [확정] 정태훈 님과 협의 완료 (2026-08-28) — Loki는 worker-02에 배치 (Prometheus는 worker-01).
# 근거: Prometheus/Loki를 서로 다른 Worker에 분리해서 F-13(Node 유실) 장애 실험 시
# Metric·Log 유실 범위를 독립적으로 측정하기 위함.
#
# [Node 측 준비] hostPath 디렉토리(/mnt/observability/loki)는 worker-02에
# 사전에 생성 + 권한 설정되어 있어야 합니다 (Ansible Role 또는 수동 준비, 별도 확인 필요).
#
# [용량/보존] 06 문서 기준 "72시간 또는 10GiB, Node 종속·일부 Log 유실 수용" —
# PV 용량은 10GiB. 실제 보존 기간(retention_period: 72h)은 Loki 자체 설정(limits_config)에서
# 별도로 지정해야 하며 이 파일은 Storage 용량만 다룸.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-local-pv
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/observability/loki
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker-02
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-local-pvc
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  volumeName: loki-local-pv
  resources:
    requests:
      storage: 10Gi

