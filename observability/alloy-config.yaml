# 작성자: 최유준
# 작성 날짜: 2026-09-14
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    // Kubernetes Pod 목록 discovery (containerd 로그 경로 매핑용)
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node_name"
      }

      // containerd 로그 실제 경로: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    // containerd CRI 로그 포맷(timestamp/stream/log) 파싱
    loki.process "pod_logs" {
      forward_to = [loki.write.default.receiver]

      stage.cri {}
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    // Alloy 자체 상태 노출 (Prometheus scrape 대상, servicemonitor-alloy.yaml에서 참조 예정)
    livedebugging {
      enabled = true
    }

    // ── 노드 systemd journal 로그 수집 ──
    // worker-01 확인 결과: persistent journal(/var/log/journal) 없음, volatile
    // journal(/run/log/journal)만 존재. group systemd-journal 전용 권한이라
    // 컨테이너는 root로 읽음(아래 securityContext 참고).
    discovery.relabel "journal" {
      targets = []

      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }

      rule {
        source_labels = ["__journal__hostname"]
        target_label  = "node_name"
      }

      rule {
        source_labels = ["__journal_priority_keyword"]
        target_label  = "level"
      }
    }

    loki.source.journal "node_journal" {
      path          = "/run/log/journal"
      relabel_rules = discovery.relabel.journal.rules
      labels        = {job = "systemd-journal"}
      forward_to    = [loki.write.default.receiver]
    }
