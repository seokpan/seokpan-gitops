# 작성자: 최유준
# 작성 날짜: 2026-08-28
#
# [범위 주의] 이 파일은 JCasC 구조 초안입니다. 아래 항목은 이번 단계(Jenkins manifest 초안)에
# 포함하지 않고 TODO로만 남겨둡니다.
#   - Admin 계정 비밀번호 (Secret 참조로 대체 필요, 하드코딩 금지)
#   - Security Realm/Authorization 전략 최종안 (현재는 최소 동작 예시)
#
# [수정, 08/28] Harbor Robot Account credential 참조 방식을 ${ENV_VAR} 치환으로 교체 완료.
# 실제 값은 Ansible이 클러스터에 직접 주입하는 jenkins-harbor-credential Secret에서 옴
# (harbor-robot-account-draft/tasks/jenkins_harbor_secrets.yml 참고, seokpan-gitops에는 미포함).
# 이 ConfigMap과 Deployment(HARBOR_ROBOT_USERNAME/PASSWORD env)는 Secret "이름"만 참조.
#
# [구조] jenkins.yaml 키 하나에 JCasC 전체 설정을 담습니다.
# Deployment에서 -Dcasc.jenkins.config=/var/jenkins_casc/jenkins.yaml 로 참조합니다 (아래 Deployment 참고).
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-jcasc
  namespace: cicd
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
data:
  jenkins.yaml: |
    jenkins:
      systemMessage: "seokpan CI/CD - managed by JCasC, do not edit via UI"
      numExecutors: 0   # Controller 자체에서는 빌드 실행 안 함, 전부 Kubernetes 동적 Agent로 위임

      # [TODO - 보안 결정 필요] 아래는 최소 동작 예시. 실 서비스 전 팀 확정 필요.
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "${JENKINS_ADMIN_ID}"
              password: "${JENKINS_ADMIN_PASSWORD}"   # Deployment의 envFrom Secret으로 주입, 하드코딩 아님
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false

      clouds:
        - kubernetes:
            name: "seokpan-k8s"
            namespace: "jenkins"
            jenkinsUrl: "http://jenkins-controller.jenkins.svc.cluster.local:8080"
            containerCapStr: "10"
            templates:
              - name: "buildkit-rootless"
                label: "buildkit-rootless"
                namespace: "jenkins"
                containers:
                  - name: "buildkit"
                    image: "moby/buildkit:rootless"
                    runAsUser: 1000
                    envVars:
                      - envVar:
                          key: "DOCKER_CONFIG"
                          value: "/home/user/.docker"
                    workingDir: "/home/workspace"
                volumes:
                  # [연동] Harbor 인증 정보 (~/.docker/config.json)를 담은 Secret.
                  # Secret 리소스 자체는 Harbor Robot Account 발급 작업(다음 단계)에서 생성.
                  - secretVolume:
                      secretName: "harbor-robot-dockerconfig"
                      mountPath: "/home/user/.docker"

    credentials:
      system:
        domainCredentials:
          - credentials:
              # [수정, 08/28] 이전 버전은 username/password를 이 파일(Git)에 직접 넣었으나
              # 06 문서 "Argo CD는 Secret 참조만 관리한다" 원칙과 어긋나 수정.
              # 실제 값은 jenkins-harbor-credential Secret(Ansible이 클러스터에 직접 주입,
              # GitOps 대상 아님)에서 Deployment env로 끌어온 뒤, 아래처럼 ${} 치환으로만 참조.
              - usernamePassword:
                  scope: GLOBAL
                  id: "harbor-robot-account"
                  username: "${HARBOR_ROBOT_USERNAME}"
                  password: "${HARBOR_ROBOT_PASSWORD}"
                  description: "Harbor push/pull robot account (seokpan project) - Ansible이 주입한 Secret 참조"

